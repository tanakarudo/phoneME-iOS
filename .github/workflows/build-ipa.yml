name: Build phoneME IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ==========================================
      # 1. Checkout source
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ==========================================
      # 2. Xcode / toolchain information
      # ==========================================
      - name: Show Xcode
        run: |
          set -e

          xcodebuild -version
          xcode-select -p
          swift --version
          clang --version
          clang++ --version

      # ==========================================
      # 3. Install build dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install \
            ripgrep \
            cmake \
            ninja

          echo "================================"
          echo "Installed build tools"
          echo "================================"

          echo "rg:"
          rg --version

          echo "cmake:"
          cmake --version

          echo "ninja:"
          ninja --version

      # ==========================================
      # 4. Verify repository structure
      # ==========================================
      - name: Verify phoneME source
        run: |
          set -e

          echo "================================"
          echo "Repository"
          echo "================================"

          pwd
          ls -la

          echo "================================"
          echo "Xcode projects"
          echo "================================"

          find . \
            -maxdepth 4 \
            -name "*.xcodeproj" \
            -print

          echo "================================"
          echo "Core build scripts"
          echo "================================"

          find . \
            -maxdepth 5 \
            -name "build-iphoneos.sh" \
            -print

          echo "================================"
          echo "Checking project"
          echo "================================"

          if [ ! -f "phoneME.xcodeproj/project.pbxproj" ]; then
            echo "ERROR: phoneME.xcodeproj was not found."
            exit 1
          fi

          echo "phoneME.xcodeproj OK"

      # ==========================================
      # 5. Check required commands
      # ==========================================
      - name: Check build commands
        run: |
          set -e

          echo "Checking required commands..."

          command -v rg
          command -v cmake
          command -v ninja
          command -v xcodebuild
          command -v clang
          command -v clang++

          echo "All required commands are available."

      # ==========================================
      # 6. Show Xcode targets / schemes
      # ==========================================
      - name: List Xcode targets
        run: |
          set -e

          xcodebuild \
            -project phoneME.xcodeproj \
            -list

      # ==========================================
      # 7. Build phoneME
      # ==========================================
      - name: Build phoneME
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -project phoneME.xcodeproj \
            -target phoneME \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ==========================================
      # 8. Find phoneME.app
      # ==========================================
      - name: Find phoneME.app
        id: find_app
        run: |
          set -euo pipefail

          echo "Searching for phoneME.app..."

          APP_PATH="$(
            find \
              "$RUNNER_TEMP/DerivedData/Build/Products" \
              -type d \
              -name "phoneME.app" \
              -print -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: phoneME.app was not found."

            echo "Available .app bundles:"
            find \
              "$RUNNER_TEMP/DerivedData" \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 9. Inspect application
      # ==========================================
      - name: Inspect phoneME app
        run: |
          set -e

          echo "================================"
          echo "Application"
          echo "================================"

          ls -lah "$APP_PATH"

          echo "================================"
          echo "Bundle identifier"
          echo "================================"

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" || true

          echo "================================"
          echo "Executable architecture"
          echo "================================"

          if [ -f "$APP_PATH/phoneME" ]; then
            file "$APP_PATH/phoneME"
            lipo -info "$APP_PATH/phoneME" || true
          fi

      # ==========================================
      # 10. Package unsigned IPA
      # ==========================================
      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf Payload
          rm -f phoneME.ipa

          mkdir -p Payload

          cp -R \
            "$APP_PATH" \
            "Payload/phoneME.app"

          /usr/bin/zip \
            -qry \
            phoneME.ipa \
            Payload

          echo "================================"
          echo "IPA created"
          echo "================================"

          ls -lh phoneME.ipa

      # ==========================================
      # 11. Validate IPA
      # ==========================================
      - name: Validate IPA
        run: |
          set -e

          if [ ! -f "phoneME.ipa" ]; then
            echo "ERROR: phoneME.ipa does not exist."
            exit 1
          fi

          echo "IPA size:"
          ls -lh phoneME.ipa

          echo "IPA contents:"
          /usr/bin/unzip -l phoneME.ipa | head -50

      # ==========================================
      # 12. Upload IPA
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-IPA
          path: phoneME.ipa
          if-no-files-found: error
          retention-days: 7
