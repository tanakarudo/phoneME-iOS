name: Build phoneME IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout source
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ==========================================
      # 2. Show Xcode information
      # ==========================================
      - name: Show Xcode
        run: |
          set -e

          xcodebuild -version
          xcode-select -p
          swift --version
          clang --version
          clang++ --version

      # ==========================================
      # 3. Install required build tools
      # ==========================================
      - name: Install dependencies
        run: |
          set -e

          brew update

          brew install ripgrep cmake ninja

          echo "===== ripgrep ====="
          rg --version

          echo "===== CMake ====="
          cmake --version

          echo "===== Ninja ====="
          ninja --version

      # ==========================================
      # 4. Verify phoneME project
      # ==========================================
      - name: Verify phoneME source
        run: |
          set -e

          echo "===== Current directory ====="
          pwd

          echo "===== Files ====="
          ls -la

          echo "===== Xcode projects ====="
          find . \
            -maxdepth 4 \
            -name "*.xcodeproj" \
            -print

          echo "===== Checking project ====="

          test -f phoneME.xcodeproj/project.pbxproj

          echo "phoneME.xcodeproj found."

      # ==========================================
      # 5. Check required commands
      # ==========================================
      - name: Check build commands
        run: |
          set -e

          echo "Checking commands..."

          command -v rg
          command -v cmake
          command -v ninja
          command -v xcodebuild
          command -v clang
          command -v clang++

          echo "All required commands found."

      # ==========================================
      # 6. Show schemes
      # ==========================================
      - name: List Xcode schemes
        run: |
          set -e

          xcodebuild \
            -project phoneME.xcodeproj \
            -list

      # ==========================================
      # 7. Build phoneME
      # ==========================================
      - name: Build phoneME
        run: |
          set -euxo pipefail

          rm -rf "$RUNNER_TEMP/DerivedData"

          xcodebuild \
            -project phoneME.xcodeproj \
            -scheme phoneME \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ==========================================
      # 8. Find phoneME.app
      # ==========================================
      - name: Find phoneME app
        run: |
          set -e

          echo "Searching for phoneME.app..."

          APP_PATH="$(
            find \
              "$RUNNER_TEMP/DerivedData/Build/Products" \
              -type d \
              -name "phoneME.app" \
              -print -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: phoneME.app was not found."

            echo "===== Available .app files ====="

            find \
              "$RUNNER_TEMP/DerivedData" \
              -type d \
              -name "*.app" \
              -print || true

            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 9. Inspect application
      # ==========================================
      - name: Inspect phoneME app
        run: |
          set -e

          echo "===== App contents ====="

          ls -lah "$APP_PATH"

          echo "===== Bundle identifier ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" || true

          echo "===== Architecture ====="

          if [ -f "$APP_PATH/phoneME" ]; then
            file "$APP_PATH/phoneME"
            lipo -info "$APP_PATH/phoneME" || true
          fi

      # ==========================================
      # 10. Create unsigned IPA
      # ==========================================
      - name: Package IPA
        run: |
          set -euxo pipefail

          rm -rf Payload
          rm -f phoneME.ipa

          mkdir -p Payload

          cp -R \
            "$APP_PATH" \
            Payload/phoneME.app

          zip -qry \
            phoneME.ipa \
            Payload

          echo "===== IPA ====="

          ls -lh phoneME.ipa

      # ==========================================
      # 11. Validate IPA
      # ==========================================
      - name: Validate IPA
        run: |
          set -e

          test -f phoneME.ipa

          echo "IPA successfully created."

          ls -lh phoneME.ipa

          echo "===== IPA contents ====="

          unzip -l phoneME.ipa | head -50

      # ==========================================
      # 12. Upload IPA
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-IPA
          path: phoneME.ipa
          if-no-files-found: error
          retention-days: 7
