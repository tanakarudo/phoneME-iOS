name: Build phoneME IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          clang++ --version
          cmake --version
      - name: Verify phoneME project
        run: |
          test -f phoneME.xcodeproj/project.pbxproj
          test -x Core/Tools/build-iphoneos.sh
          xcodebuild \
            -project phoneME.xcodeproj \
            -list


      - name: Build phoneME for iOS
        run: |
          set -euxo pipefail

          xcodebuild \
            -project phoneME.xcodeproj \
            -target phoneME \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Find application
        id: app
        run: |
          set -euo pipefail

          APP_PATH="$(find \
            "$RUNNER_TEMP/DerivedData/Build/Products" \
            -type d \
            -name 'phoneME.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "phoneME.app was not found."
            find "$RUNNER_TEMP/DerivedData" \
              -type d \
              -name '*.app' \
              -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found: $APP_PATH"

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail

          rm -rf Payload phoneME.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/phoneME.app

          /usr/bin/zip \
            -qry \
            phoneME.ipa \
            Payload

          ls -lh phoneME.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-IPA
          path: phoneME.ipa
          if-no-files-found: error
          retention-days: 7
