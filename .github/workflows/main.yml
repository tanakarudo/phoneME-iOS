name: Build phoneME iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List project
        run: |
          ls -la
          find . -maxdepth 2 -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: List schemes
        run: |
          xcodebuild -list -project phoneME.xcodeproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project phoneME.xcodeproj \
            -scheme phoneME \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/phoneME.app Payload/
          zip -r phoneME-unsigned.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phoneME-unsigned-ipa
          path: phoneME-unsigned.ipa
